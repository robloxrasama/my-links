<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#05060f">
    <title>Rasama</title>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        :root {
            --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", system-ui, "Segoe UI", Roboto, Arial, sans-serif;
            --text: #ffffff;
            --text-2: rgba(255, 255, 255, 0.72);
            --ease-out: cubic-bezier(.2, .8, .2, 1);
            --spring: cubic-bezier(.34, 1.56, .64, 1);

            /* день */
            --bg: #5f7dff;
            --orb-1: #b58cff;
            --orb-2: #4fd0ff;
            --orb-3: #ff9ad5;
            --orb-4: #7affd9;

            --glass-top: rgba(255, 255, 255, 0.34);
            --glass-bottom: rgba(255, 255, 255, 0.08);
            --glass-edge: rgba(255, 255, 255, 0.75);
            --glass-shadow: rgba(30, 40, 120, 0.28);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #080a1f;
                --orb-1: #5a3dff;
                --orb-2: #0f86d6;
                --orb-3: #b02bd0;
                --orb-4: #0bb59a;

                --glass-top: rgba(255, 255, 255, 0.2);
                --glass-bottom: rgba(255, 255, 255, 0.04);
                --glass-edge: rgba(255, 255, 255, 0.5);
                --glass-shadow: rgba(0, 0, 0, 0.45);
            }
        }

        html, body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
            font-family: var(--font);
            color: var(--text);
            background: #05060f;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        /* ================= ФОН ================= */
        .backdrop {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            background: var(--bg);
            animation: lightsOn 2s ease-out both;
        }

        @keyframes lightsOn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .orb {
            position: absolute;
            width: 62vmax;
            height: 62vmax;
            border-radius: 50%;
            opacity: 0.8;
            will-change: transform;
            backface-visibility: hidden;
        }

        .orb.one {
            top: -22vmax;
            left: -18vmax;
            background: radial-gradient(circle closest-side, var(--orb-1), transparent);
            animation: float1 24s ease-in-out infinite alternate;
        }

        .orb.two {
            bottom: -26vmax;
            right: -20vmax;
            background: radial-gradient(circle closest-side, var(--orb-2), transparent);
            animation: float2 28s ease-in-out infinite alternate;
        }

        .orb.three {
            top: 18%;
            right: -18vmax;
            width: 46vmax;
            height: 46vmax;
            opacity: 0.6;
            background: radial-gradient(circle closest-side, var(--orb-3), transparent);
            animation: float3 32s ease-in-out infinite alternate;
        }

        .orb.four {
            bottom: -10vmax;
            left: -14vmax;
            width: 44vmax;
            height: 44vmax;
            opacity: 0.5;
            background: radial-gradient(circle closest-side, var(--orb-4), transparent);
            animation: float4 36s ease-in-out infinite alternate;
        }

        @keyframes float1 {
            from { transform: translate3d(0, 0, 0) scale(1); }
            to   { transform: translate3d(22vmax, 14vmax, 0) scale(1.15); }
        }

        @keyframes float2 {
            from { transform: translate3d(0, 0, 0) scale(1); }
            to   { transform: translate3d(-20vmax, -12vmax, 0) scale(1.1); }
        }

        @keyframes float3 {
            from { transform: translate3d(0, 0, 0) scale(1); }
            to   { transform: translate3d(-26vmax, 10vmax, 0) scale(1.25); }
        }

        @keyframes float4 {
            from { transform: translate3d(0, 0, 0) scale(1.1); }
            to   { transform: translate3d(18vmax, -14vmax, 0) scale(0.9); }
        }

        /* ================= СНЕГ ================= */
        #snow {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0;
            transition: opacity 2.4s ease 0.4s;
        }

        #snow.on {
            opacity: 1;
        }

        /* ================= КОНТЕНТ ================= */
        main {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 380px;
        }

        .reveal {
            animation: reveal 0.9s var(--ease-out) var(--d, 0s) backwards;
        }

        @keyframes reveal {
            from { opacity: 0; transform: translateY(26px) scale(0.96); }
        }

        /* ---------- Шапка ---------- */
        .profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 32px;
        }

        .avatar-wrap {
            position: relative;
            width: 112px;
            height: 112px;
            margin-bottom: 18px;
            animation: bob 6s ease-in-out 2s infinite;
        }

        @keyframes bob {
            0%, 100% { transform: translate3d(0, 0, 0); }
            50%      { transform: translate3d(0, -7px, 0); }
        }

        .avatar-wrap::before {
            content: "";
            position: absolute;
            inset: -26px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #7ad7ff, #c58bff, #ff9ad5, #7affd9, #7ad7ff);
            -webkit-mask-image: radial-gradient(closest-side, #000 52%, transparent 100%);
            mask-image: radial-gradient(closest-side, #000 52%, transparent 100%);
            will-change: transform;
            animation:
                spin 12s linear infinite,
                glowIn 1.6s ease 0.3s backwards;
            opacity: 0.6;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes glowIn {
            from { opacity: 0; }
        }

        .avatar-wrap::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 34px;
            border: 2px solid rgba(255, 255, 255, 0.7);
            opacity: 0;
            pointer-events: none;
            animation: ring 1.4s ease-out 0.55s backwards;
        }

        @keyframes ring {
            from { opacity: 0.9; transform: scale(0.9); }
            to   { opacity: 0;   transform: scale(2.1); }
        }

        .avatar {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 34px;
            display: grid;
            place-items: center;
            font-size: 50px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #fff;
            text-shadow: 0 2px 16px rgba(60, 60, 160, 0.45);
            background:
                radial-gradient(120% 90% at 25% 10%, rgba(255, 255, 255, 0.55), transparent 55%),
                linear-gradient(145deg, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0.06));
            -webkit-backdrop-filter: blur(12px) saturate(170%);
            backdrop-filter: blur(12px) saturate(170%);
            box-shadow:
                inset 0 1.5px 0 rgba(255, 255, 255, 0.8),
                inset 0 -1px 0 rgba(255, 255, 255, 0.15),
                inset 0 0 24px rgba(255, 255, 255, 0.12),
                0 18px 40px var(--glass-shadow);
            animation: avatarIn 1.1s var(--spring) 0.2s backwards;
        }

        @keyframes avatarIn {
            from { opacity: 0; transform: translateY(40px) scale(0.4) rotate(-24deg); }
        }

        .avatar span {
            display: block;
            animation: letterPop 0.7s var(--spring) 0.65s backwards;
        }

        @keyframes letterPop {
            from { opacity: 0; transform: scale(0.3); }
        }

        .title {
            margin: 0;
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -0.025em;
            text-shadow: 0 2px 20px rgba(40, 50, 140, 0.35);
        }

        .ch {
            display: inline-block;
            animation: chIn 0.8s cubic-bezier(.2, .9, .25, 1.25) calc(0.7s + var(--i) * 0.07s) backwards;
        }

        @keyframes chIn {
            from { opacity: 0; transform: translateY(0.6em) scale(0.8); }
        }

        /* ---------- Стеклянные кнопки ---------- */
        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .row {
            --mx: 50%;
            --my: 0%;
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
            min-height: 76px;
            padding: 12px 18px 12px 14px;
            border-radius: 26px;
            overflow: hidden;
            isolation: isolate;
            color: var(--text);
            text-decoration: none;
            background: linear-gradient(135deg, var(--glass-top), var(--glass-bottom));
            -webkit-backdrop-filter: blur(14px) saturate(170%);
            backdrop-filter: blur(14px) saturate(170%);
            box-shadow:
                inset 0 1.5px 0 rgba(255, 255, 255, 0.7),
                inset 0 -1px 0 rgba(255, 255, 255, 0.12),
                inset 0 0 26px rgba(255, 255, 255, 0.08),
                0 14px 34px var(--glass-shadow);
            transition: transform 0.35s var(--ease-out), box-shadow 0.35s ease;
        }

        .row::before {
            content: "";
            position: absolute;
            inset: 0;
            padding: 1px;
            border-radius: inherit;
            background: linear-gradient(135deg, var(--glass-edge), rgba(255, 255, 255, 0.05) 35%, rgba(255, 255, 255, 0.05) 65%, rgba(255, 255, 255, 0.4));
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 2;
        }

        .row::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(200px circle at var(--mx) var(--my), rgba(255, 255, 255, 0.38), transparent 60%),
                linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, 0.3) 50%, transparent 65%);
            background-size: 100% 100%, 250% 100%;
            background-position: 0 0, 160% 0;
            background-repeat: no-repeat;
            opacity: 0;
            pointer-events: none;
            z-index: 1;
            transition: opacity 0.3s ease;
            animation: introSheen 1.5s ease var(--sd, 1.6s) both;
        }

        @keyframes introSheen {
            0%   { opacity: 0; background-position: 0 0, 160% 0; }
            25%  { opacity: 1; }
            100% { opacity: 0; background-position: 0 0, -60% 0; }
        }

        @keyframes sheen {
            from { background-position: 0 0, 160% 0; }
            to   { background-position: 0 0, -60% 0; }
        }

        .row:focus-visible::after,
        .row.touch::after {
            opacity: 1;
            animation: sheen 1.1s ease forwards;
        }

        @media (hover: hover) {
            .row:hover {
                transform: translateY(-3px) scale(1.012);
                box-shadow:
                    inset 0 1.5px 0 rgba(255, 255, 255, 0.85),
                    inset 0 -1px 0 rgba(255, 255, 255, 0.18),
                    inset 0 0 30px rgba(255, 255, 255, 0.14),
                    0 22px 44px var(--glass-shadow);
            }

            .row:hover::after {
                opacity: 1;
                animation: sheen 1.1s ease forwards;
            }

            .row:hover .chevron {
                transform: translateX(4px);
            }
        }

        .row:active {
            transform: scale(0.975);
        }

        .row:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 3px;
        }

        .badge {
            position: relative;
            z-index: 3;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            width: 48px;
            height: 48px;
            border-radius: 16px;
            font-size: 23px;
            background:
                radial-gradient(120% 90% at 25% 10%, rgba(255, 255, 255, 0.5), transparent 55%),
                linear-gradient(145deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.05));
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.75),
                inset 0 0 12px rgba(255, 255, 255, 0.12),
                0 6px 16px rgba(20, 30, 100, 0.2);
            animation: badgePop 0.7s var(--spring) calc(var(--d, 0s) + 0.25s) backwards;
        }

        @keyframes badgePop {
            from { opacity: 0; transform: scale(0.4) rotate(-15deg); }
        }

        .row-text {
            position: relative;
            z-index: 3;
            flex: 1;
            min-width: 0;
        }

        .row-title {
            display: block;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.01em;
            text-shadow: 0 1px 10px rgba(30, 40, 120, 0.25);
        }

        .row-sub {
            display: block;
            margin-top: 2px;
            font-size: 13px;
            color: var(--text-2);
        }

        .chevron {
            position: relative;
            z-index: 3;
            flex-shrink: 0;
            width: 10px;
            height: 18px;
            color: rgba(255, 255, 255, 0.8);
            transition: transform 0.3s ease;
        }

        .footer {
            margin: 28px 0 0;
            text-align: center;
            font-size: 13px;
            color: var(--text-2);
            text-shadow: 0 1px 8px rgba(30, 40, 120, 0.3);
        }

        /* ---------- Облегчённый режим ---------- */
        .lite .row,
        .lite .avatar {
            -webkit-backdrop-filter: none;
            backdrop-filter: none;
        }

        .lite .row {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.36), rgba(255, 255, 255, 0.14));
        }

        .lite .avatar {
            background:
                radial-gradient(120% 90% at 25% 10%, rgba(255, 255, 255, 0.55), transparent 55%),
                linear-gradient(145deg, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.16));
        }

        .lite .row::after {
            display: none;
        }

        .lite .avatar-wrap::before {
            animation: none;
        }

        @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
            .row {
                background: linear-gradient(135deg, rgba(255, 255, 255, 0.36), rgba(255, 255, 255, 0.14));
            }

            .avatar {
                background:
                    radial-gradient(120% 90% at 25% 10%, rgba(255, 255, 255, 0.55), transparent 55%),
                    linear-gradient(145deg, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.16));
            }
        }

        /* ---------- Адаптив ---------- */
        @media (max-height: 660px) {
            .profile {
                margin-bottom: 20px;
            }

            .avatar-wrap {
                width: 84px;
                height: 84px;
                margin-bottom: 12px;
            }

            .avatar,
            .avatar-wrap::after {
                border-radius: 26px;
            }

            .avatar {
                font-size: 38px;
            }

            .title {
                font-size: 28px;
            }

            .row {
                min-height: 68px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-delay: 0s !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <div class="backdrop" aria-hidden="true">
        <div class="orb one"></div>
        <div class="orb two"></div>
        <div class="orb three"></div>
        <div class="orb four"></div>
    </div>

    <canvas id="snow" aria-hidden="true"></canvas>

    <main>
        <header class="profile">
            <div class="avatar-wrap">
                <div class="avatar" aria-hidden="true"><span>R</span></div>
            </div>
            <h1 class="title" aria-label="Rasama">
                <span class="ch" style="--i:0" aria-hidden="true">R</span><span class="ch" style="--i:1" aria-hidden="true">a</span><span class="ch" style="--i:2" aria-hidden="true">s</span><span class="ch" style="--i:3" aria-hidden="true">a</span><span class="ch" style="--i:4" aria-hidden="true">m</span><span class="ch" style="--i:5" aria-hidden="true">a</span>
            </h1>
        </header>

        <nav class="links">
            <a class="row reveal" style="--d: 1s; --sd: 1.7s"
               href="https://www.donationalerts.com/r/canot"
               target="_blank"
               rel="noopener noreferrer">
                <span class="badge" aria-hidden="true">💜</span>
                <span class="row-text">
                    <span class="row-title">Поддержать</span>
                    <span class="row-sub">Донат через DonationAlerts</span>
                </span>
                <svg class="chevron" viewBox="0 0 10 18" aria-hidden="true">
                    <path d="M2 2l6 7-6 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>

            <a class="row reveal" style="--d: 1.15s; --sd: 1.9s"
               href="https://t.me/RasamaDrop"
               target="_blank"
               rel="noopener noreferrer">
                <span class="badge" aria-hidden="true">✈️</span>
                <span class="row-text">
                    <span class="row-title">Telegram</span>
                    <span class="row-sub">t.me/RasamaDrop</span>
                </span>
                <svg class="chevron" viewBox="0 0 10 18" aria-hidden="true">
                    <path d="M2 2l6 7-6 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>
        </nav>

        <p class="footer reveal" style="--d: 1.45s">Спасибо за поддержку</p>
    </main>

    <script>
        // ===== Блик на стекле: следует за курсором и пальцем =====
        document.querySelectorAll(".row").forEach(function (row) {
            var rect = null, px = 0, py = 0, queued = false;

            function apply() {
                queued = false;
                row.style.setProperty("--mx", (px - rect.left) + "px");
                row.style.setProperty("--my", (py - rect.top) + "px");
            }
            function track(e) {
                if (!rect) rect = row.getBoundingClientRect();
                px = e.clientX;
                py = e.clientY;
                if (!queued) {
                    queued = true;
                    requestAnimationFrame(apply);
                }
            }

            row.addEventListener("pointerenter", function () { rect = row.getBoundingClientRect(); });
            row.addEventListener("pointermove", track);
            row.addEventListener("pointerdown", function (e) {
                rect = row.getBoundingClientRect();
                track(e);
                row.classList.add("touch");
            });
            ["pointerup", "pointercancel", "pointerleave"].forEach(function (t) {
                row.addEventListener(t, function () { row.classList.remove("touch"); });
            });
        });
        window.addEventListener("resize", function () {
            document.querySelectorAll(".row").forEach(function (r) { r.dispatchEvent(new Event("pointerenter")); });
        });

        // ===== Снег =====
        (function () {
            if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;

            var canvas = document.getElementById("snow");
            var ctx = canvas.getContext("2d", { alpha: true });
            var dpr = Math.min(window.devicePixelRatio || 1, 2);
            var W = 0, H = 0;

            function resize() {
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = Math.round(W * dpr);
                canvas.height = Math.round(H * dpr);
            }
            resize();
            window.addEventListener("resize", resize);

            function crystal(size, variant) {
                var s = Math.ceil(size * 2 + 8);
                var c = document.createElement("canvas");
                c.width = c.height = Math.round(s * dpr);
                var g = c.getContext("2d");
                g.scale(dpr, dpr);
                g.translate(s / 2, s / 2);

                var R = size;
                g.lineCap = "round";
                g.strokeStyle = "rgba(255,255,255,0.96)";
                g.shadowColor = "rgba(190,225,255,0.95)";
                g.shadowBlur = Math.max(2, size * 0.4);
                g.lineWidth = Math.max(0.8, size * 0.08);

                for (var i = 0; i < 6; i++) {
                    g.save();
                    g.rotate(i * Math.PI / 3);

                    g.beginPath();
                    g.moveTo(0, 0);
                    g.lineTo(0, -R);
                    g.stroke();

                    var branches = variant === 0 ? [[0.45, 0.32], [0.72, 0.24]]
                                 : variant === 1 ? [[0.38, 0.38], [0.62, 0.28], [0.84, 0.16]]
                                 :                 [[0.55, 0.42]];
                    for (var b = 0; b < branches.length; b++) {
                        var pos = branches[b][0], len = branches[b][1] * R;
                        var y = -R * pos;
                        g.beginPath();
                        g.moveTo(0, y);
                        g.lineTo(-len * 0.8, y - len * 0.62);
                        g.moveTo(0, y);
                        g.lineTo(len * 0.8, y - len * 0.62);
                        g.stroke();
                    }
                    g.restore();
                }

                g.beginPath();
                g.arc(0, 0, Math.max(1, size * 0.1), 0, Math.PI * 2);
                g.fillStyle = "#fff";
                g.fill();

                return { img: c, w: s, h: s };
            }

            function bokeh(size) {
                var s = Math.ceil(size * 2);
                var c = document.createElement("canvas");
                c.width = c.height = Math.round(s * dpr);
                var g = c.getContext("2d");
                g.scale(dpr, dpr);
                var grad = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
                grad.addColorStop(0, "rgba(255,255,255,0.95)");
                grad.addColorStop(0.45, "rgba(255,255,255,0.45)");
                grad.addColorStop(1, "rgba(255,255,255,0)");
                g.fillStyle = grad;
                g.fillRect(0, 0, s, s);
                return { img: c, w: s, h: s };
            }

            var sprites = {
                far:  [crystal(4, 2), crystal(5, 0)],
                mid:  [crystal(8, 0), crystal(9, 1), crystal(8, 2)],
                near: [crystal(14, 1), crystal(16, 0), crystal(14, 2)],
                dust: [bokeh(2.5), bokeh(3.5)],
                blur: [bokeh(16), bokeh(22)]
            };

            var small = W < 600;
            var plan = [
                { layer: "dust", n: small ? 22 : 40, speed: [14, 26],   alpha: [0.35, 0.7], spin: 0,   top: false },
                { layer: "far",  n: small ? 16 : 28, speed: [22, 36],   alpha: [0.45, 0.75], spin: 0.5, top: false },
                { layer: "mid",  n: small ? 9  : 16, speed: [38, 56],   alpha: [0.7, 0.95], spin: 0.9, top: true },
                { layer: "near", n: small ? 3  : 5,  speed: [70, 100],  alpha: [0.85, 1],   spin: 1.2, top: true },
                { layer: "blur", n: small ? 2  : 3,  speed: [110, 150], alpha: [0.16, 0.28], spin: 0,  top: true }
            ];

            function rand(a, b) { return a + Math.random() * (b - a); }

            var flakes = [];
            plan.forEach(function (p) {
                for (var i = 0; i < p.n; i++) {
                    var set = sprites[p.layer];
                    flakes.push({
                        sprite: set[Math.floor(Math.random() * set.length)],
                        x: rand(0, W),
                        y: p.top ? rand(-H, -20) : rand(-40, H),
                        vy: rand(p.speed[0], p.speed[1]),
                        alpha: rand(p.alpha[0], p.alpha[1]),
                        phase: rand(0, Math.PI * 2),
                        sway: rand(8, 22),
                        swaySpeed: rand(0.4, 1.0),
                        rot: rand(0, Math.PI * 2),
                        rotSpeed: rand(-p.spin, p.spin),
                        twinkle: rand(0, Math.PI * 2),
                        depth: p.layer,
                        windK: (p.layer === "near" || p.layer === "blur") ? 1.4 : p.layer === "mid" ? 1 : 0.6,
                        twinkles: p.layer === "far" || p.layer === "dust"
                    });
                }
            });

            requestAnimationFrame(function () { canvas.classList.add("on"); });

            var wind = 0, windTarget = 0, lastX = null;
            window.addEventListener("pointermove", function (e) {
                if (lastX !== null) {
                    windTarget = Math.max(-60, Math.min(60, (e.clientX - lastX) * 2.2));
                }
                lastX = e.clientX;
            }, { passive: true });

            // Адаптивное качество: держим 60 fps
            var level = 0;
            var sumDt = 0, cnt = 0;
            var measureFrom = performance.now() + 3500;

            function degrade() {
                level++;
                if (level === 1) {
                    flakes = flakes.filter(function (f, i) { return f.depth !== "blur" && !(f.depth === "dust" && i % 2); });
                } else if (level === 2) {
                    document.documentElement.classList.add("lite");
                } else if (level === 3) {
                    flakes = flakes.filter(function (f, i) { return i % 2 === 0; });
                }
                sumDt = 0; cnt = 0;
                measureFrom = performance.now() + 2500;
            }

            var last = performance.now();

            document.addEventListener("visibilitychange", function () {
                last = performance.now();
                measureFrom = last + 1500;
                sumDt = 0; cnt = 0;
            });

            function frame(now) {
                var raw = (now - last) / 1000;
                var dt = Math.min(raw, 0.05);
                last = now;

                if (now > measureFrom && level < 3 && raw < 0.2) {
                    sumDt += raw; cnt++;
                    if (cnt >= 90) {
                        if (sumDt / cnt > 0.0215) degrade();
                        else { sumDt = 0; cnt = 0; }
                    }
                }

                var t = now / 1000;
                windTarget *= 0.96;
                wind += (windTarget - wind) * 0.04;
                var baseWind = Math.sin(t * 0.25) * 12 + wind;

                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                for (var i = 0; i < flakes.length; i++) {
                    var f = flakes[i];
                    var sp = f.sprite;

                    f.y += f.vy * dt;
                    f.x += baseWind * f.windK * dt + Math.sin(t * f.swaySpeed + f.phase) * f.sway * dt;

                    if (f.y - sp.h > H) { f.y = -sp.h; f.x = rand(0, W); }
                    if (f.x < -60) f.x = W + 40;
                    else if (f.x > W + 60) f.x = -40;

                    var a = f.alpha;
                    if (f.twinkles) a *= 0.8 + 0.2 * Math.sin(t * 1.6 + f.twinkle);
                    if (f.y < 40) a *= Math.max(0, (f.y + sp.h) / (40 + sp.h));
                    if (a <= 0.01) continue;

                    ctx.globalAlpha = a;

                    if (f.rotSpeed) {
                        f.rot += f.rotSpeed * dt;
                        var cs = Math.cos(f.rot) * dpr, sn = Math.sin(f.rot) * dpr;
                        ctx.setTransform(cs, sn, -sn, cs, f.x * dpr, f.y * dpr);
                    } else {
                        ctx.setTransform(dpr, 0, 0, dpr, f.x * dpr, f.y * dpr);
                    }
                    ctx.drawImage(sp.img, -sp.w / 2, -sp.h / 2, sp.w, sp.h);
                }

                requestAnimationFrame(frame);
            }
            requestAnimationFrame(frame);
        })();
    </script>
