<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Rasama</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100svh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family: Arial, Helvetica, sans-serif;
            color: #fff;

            background: #08080d;
        }

        /* Фоновое свечение */
        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .glow {
            position: absolute;
            width: 380px;
            height: 380px;

            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.22;

            animation: moveGlow 14s ease-in-out infinite alternate;
        }

        .glow.one {
            top: -160px;
            left: -120px;
            background: #7c3aed;
        }

        .glow.two {
            right: -150px;
            bottom: -170px;
            background: #2563eb;
            animation-delay: -5s;
        }

        @keyframes moveGlow {
            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(80px, 40px) scale(1.15);
            }

            100% {
                transform: translate(-30px, 80px) scale(0.95);
            }
        }

        /* Точки на фоне */
        .stars {
            position: absolute;
            inset: 0;
        }

        .star {
            position: absolute;

            width: 3px;
            height: 3px;

            border-radius: 50%;
            background: rgba(255, 255, 255, 0.7);

            animation: starFloat 8s ease-in-out infinite;
        }

        .star:nth-child(1) {
            left: 10%;
            top: 20%;
        }

        .star:nth-child(2) {
            left: 25%;
            top: 75%;
            animation-delay: -2s;
        }

        .star:nth-child(3) {
            left: 48%;
            top: 15%;
            animation-delay: -4s;
        }

        .star:nth-child(4) {
            left: 72%;
            top: 30%;
            animation-delay: -1s;
        }

        .star:nth-child(5) {
            left: 88%;
            top: 70%;
            animation-delay: -5s;
        }

        .star:nth-child(6) {
            left: 60%;
            top: 85%;
            animation-delay: -3s;
        }

        @keyframes starFloat {
            0%, 100% {
                opacity: 0.2;
                transform: translateY(0);
            }

            50% {
                opacity: 1;
                transform: translateY(-18px);
            }
        }

        /* Карточка */
        .container {
            position: relative;
            z-index: 2;

            width: 100%;
            max-width: 410px;

            padding: 38px 26px;

            text-align: center;

            background: rgba(15, 15, 22, 0.72);

            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 28px;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.55);

            /* Анимация открытия сайта */
            opacity: 0;
            transform: translateY(35px) scale(0.94);

            animation: pageOpen 0.9s cubic-bezier(.22, 1, .36, 1) forwards;
        }

        @keyframes pageOpen {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Логотип */
        .logo {
            width: 86px;
            height: 86px;

            margin: 0 auto 18px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            background: linear-gradient(
                135deg,
                #8b5cf6,
                #3b82f6
            );

            font-size: 34px;
            font-weight: 700;

            box-shadow:
                0 0 35px rgba(99, 102, 241, 0.35);

            animation: logoAppear 1s ease 0.2s both;
        }

        @keyframes logoAppear {
            from {
                opacity: 0;
                transform: scale(0.6) rotate(-10deg);
            }

            to {
                opacity: 1;
                transform: scale(1) rotate(0);
            }
        }

        h1 {
            margin: 0 0 26px;

            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.5px;

            animation: textAppear 0.8s ease 0.35s both;
        }

        @keyframes textAppear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Кнопки */
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .button {
            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            min-height: 58px;

            padding: 14px 50px;

            border-radius: 15px;

            color: #fff;
            text-decoration: none;

            font-size: 16px;
            font-weight: 600;

            background: rgba(255, 255, 255, 0.07);

            border: 1px solid rgba(255, 255, 255, 0.10);

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;

            animation: buttonAppear 0.7s ease both;
        }

        .button:nth-child(1) {
            animation-delay: 0.5s;
        }

        .button:nth-child(2) {
            animation-delay: 0.65s;
        }

        @keyframes buttonAppear {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .button:hover {
            transform: translateY(-3px);

            background: rgba(255, 255, 255, 0.13);

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.3);
        }

        .button:active {
            transform: scale(0.97);
        }

        .donate {
            background: linear-gradient(
                135deg,
                #8b5cf6,
                #6366f1
            );

            border: none;

            box-shadow:
                0 8px 25px rgba(99, 102, 241, 0.25);
        }

        .donate:hover {
            background: linear-gradient(
                135deg,
                #9d6cff,
                #7180ff
            );

            box-shadow:
                0 12px 35px rgba(99, 102, 241, 0.4);
        }

        .icon {
            position: absolute;
            left: 18px;

            font-size: 21px;
        }

        /* Телефоны */
        @media (max-width: 480px) {
            body {
                padding: 14px;
            }

            .container {
                max-width: 100%;
                padding: 32px 18px;
                border-radius: 24px;
            }

            .logo {
                width: 76px;
                height: 76px;
                font-size: 30px;
                margin-bottom: 16px;
            }

            h1 {
                font-size: 27px;
                margin-bottom: 22px;
            }

            .button {
                min-height: 56px;
                font-size: 16px;
                border-radius: 14px;
            }
        }

        /* Очень маленькие экраны */
        @media (max-height: 600px) {
            .container {
                padding: 24px 18px;
            }

            .logo {
                width: 65px;
                height: 65px;
                font-size: 26px;
                margin-bottom: 12px;
            }

            h1 {
                margin-bottom: 18px;
                font-size: 25px;
            }
        }

        /* Уважение к настройке уменьшения анимаций */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
