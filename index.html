<title>Rasama | Links</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;

        font-family: Arial, Helvetica, sans-serif;
        color: white;

        background:
            radial-gradient(circle at 20% 20%, #5b21b6 0%, transparent 30%),
            radial-gradient(circle at 80% 80%, #2563eb 0%, transparent 30%),
            #080810;

        overflow: hidden;
    }

    /* Светящиеся круги на фоне */
    body::before,
    body::after {
        content: "";
        position: fixed;
        width: 300px;
        height: 300px;
        border-radius: 50%;
        filter: blur(100px);
        opacity: 0.25;
        z-index: -1;
    }

    body::before {
        background: #8b5cf6;
        top: -100px;
        left: -100px;
    }

    body::after {
        background: #3b82f6;
        bottom: -100px;
        right: -100px;
    }

    .card {
        width: 90%;
        max-width: 430px;
        padding: 40px 28px;

        text-align: center;

        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 28px;

        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);

        box-shadow:
            0 25px 80px rgba(0, 0, 0, 0.45);

        animation: appear 0.8s ease;
    }

    @keyframes appear {
        from {
            opacity: 0;
            transform: translateY(25px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .avatar {
        width: 90px;
        height: 90px;

        margin: 0 auto 18px;

        display: flex;
        justify-content: center;
        align-items: center;

        border-radius: 50%;

        background: linear-gradient(135deg, #8b5cf6, #2563eb);

        font-size: 38px;
        font-weight: bold;

        box-shadow:
            0 0 35px rgba(99, 102, 241, 0.5);
    }

    h1 {
        font-size: 30px;
        margin-bottom: 8px;
    }

    .description {
        color: #a9a9b5;
        font-size: 15px;
        margin-bottom: 28px;
    }

    .links {
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .link {
        position: relative;

        display: flex;
        align-items: center;
        justify-content: center;

        min-height: 58px;
        padding: 0 20px;

        border-radius: 15px;

        color: white;
        text-decoration: none;
        font-size: 17px;
        font-weight: 600;

        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);

        transition:
            transform 0.25s ease,
            background 0.25s ease,
            box-shadow 0.25s ease;
    }

    .link:hover {
        transform: translateY(-4px);

        background: rgba(255, 255, 255, 0.14);

        box-shadow:
            0 12px 30px rgba(0, 0, 0, 0.3);
    }

    .donate {
        background: linear-gradient(
            135deg,
            #8b5cf6,
            #6366f1
        );

        border: none;

        box-shadow:
            0 8px 25px rgba(99, 102, 241, 0.3);
    }

    .donate:hover {
        background: linear-gradient(
            135deg,
            #9d6cff,
            #7180ff
        );

        box-shadow:
            0 12px 35px rgba(99, 102, 241, 0.45);
    }

    .icon {
        position: absolute;
        left: 18px;
        font-size: 23px;
    }

    footer {
        margin-top: 28px;
        color: #686875;
        font-size: 12px;
    }

    @media (max-width: 480px) {
        .card {
            padding: 32px 20px;
        }

        h1 {
            font-size: 27px;
        }
    }
</style>
<main class="card">

    <div class="avatar">
        R
    </div>

    <h1>Rasama</h1>

    <p class="description">
        Мои ссылки и поддержка ❤️
    </p>

    <div class="links">

        <a
            class="link donate"
            href="https://www.donationalerts.
com/r/canot"
            target="_blank"
            rel="noopener noreferrer"
        >
            <span class="icon">💜</span>
            Поддержать меня
        </a>

        <a
            class="link"
            href="https://t.me/RasamaCs2"
            target="_blank"
            rel="noopener noreferrer"
        >
            <span class="icon">✈️</span>
            Мой Telegram
        </a>

    </div>

    <footer>
        © 2026 Rasama
    </footer>

</main>
